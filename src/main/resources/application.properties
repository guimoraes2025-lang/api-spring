spring.application.name=api-spring

# Permite conexoes locais na porta padrao 8080
server.address=0.0.0.0
server.port=8080

# Habilita o console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracoes de conexao com o banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto Hibernate e inicializacao JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# Desabilita cache do Thymeleaf para atualizar paginas sem reiniciar
spring.thymeleaf.cache=false